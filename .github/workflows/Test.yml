name: Failed Test Scenario

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Failing Test
        # Returning any non-zero exit code marks the step and job as failed
        run: |
          echo "Simulating a test failure..."
          exit 1 

  deploy:
    runs-on: ubuntu-latest
    needs: test  # This job will be skipped because 'test' failed
    steps:
      - name: Deploying
        run: echo "This will not run."
