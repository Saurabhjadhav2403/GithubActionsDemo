name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: echo "Running tests..."

  deploy:
    runs-on: ubuntu-latest
    needs: test  # This ensures deploy only runs if test passes
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploying application..."
